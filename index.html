  :root {
    --gold: #f5c26b;
    --rose: #ff7b9c;
    --ink: #f3f0ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: "Songti SC", "STSong", "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
    background: linear-gradient(180deg, #070b26 0%, #121036 42%, #251043 78%, #31144a 100%);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  /* soft nebula glows — one continuous sky */
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(640px 440px at 14% 14%, rgba(122,82,205,.22), transparent 70%),
      radial-gradient(760px 540px at 86% 26%, rgba(255,123,156,.12), transparent 70%),
      radial-gradient(560px 460px at 50% 88%, rgba(245,194,107,.09), transparent 70%);
  }

  /* ---------- sky ---------- */
  #stars { position:fixed; inset:0; z-index:1; pointer-events:none; }
  .star { position:absolute; border-radius:50%; background:#fff;
    animation: twinkle var(--tw,2s) ease-in-out infinite alternate; }
  @keyframes twinkle { from {opacity:.12} to {opacity:.95} }

  #moon { position:fixed; top:5vh; right:7vw; width:14vmin; height:14vmin; z-index:2;
    pointer-events:none; filter:drop-shadow(0 0 24px rgba(255,236,190,.55)); }

  #bridge { position:fixed; top:-6vh; left:50%; transform:translateX(-50%);
    width:100vw; height:36vh; z-index:1; pointer-events:none; opacity:.34; }

  .lantern { position:fixed; bottom:-10vh; width:34px; height:46px; z-index:2; pointer-events:none;
    border-radius:50% 50% 46% 46% / 62% 62% 38% 38%;
    background: radial-gradient(circle at 42% 30%, #ffe9b8, #f5a25c 58%, #e0694a);
    box-shadow: 0 0 24px 6px rgba(245,162,92,.42);
    animation: floatUp var(--dur,26s) linear var(--dl,0s) infinite; }
  .lantern::after { content:""; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);
    width:9px; height:11px; border-radius:50%;
    background: radial-gradient(circle at 50% 65%, #fff7d6, #ffb347 55%, #e0694a);
    box-shadow: 0 0 12px 3px rgba(255,179,71,.8); animation: flicker 1.6s ease-in-out infinite alternate; }
  @keyframes flicker { from {transform:translateX(-50%) scale(.85); opacity:.75} to {transform:translateX(-50%) scale(1.15); opacity:1} }
  @keyframes floatUp {
    0%   { transform:translate(0,0); opacity:0; }
    8%   { opacity:.85; }
    88%  { opacity:.55; }
    100% { transform:translate(var(--drift,3vw),-114vh); opacity:0; }
  }

  .magpie { position:fixed; z-index:2; pointer-events:none; opacity:.92;
    animation: flyAcross var(--fd,16s) linear var(--fdl,0s) infinite; }
  @keyframes flyAcross {
    0%   { transform:translateX(-18vw); }
    100% { transform:translateX(118vw); }
  }
  .magpie svg { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-12px)} }
  .magpie .wing { transform-box:fill-box; transform-origin:75% 40%;
    animation: flap .38s ease-in-out infinite alternate; }
  @keyframes flap { from {transform:rotate(-22deg)} to {transform:rotate(16deg)} }

  /* ---------- scene ---------- */
  #festival { position:fixed; top:14px; left:0; width:100%; text-align:center; z-index:3;
    font-size:13px; letter-spacing:8px; color:var(--gold); opacity:.8; pointer-events:none;
    text-shadow:0 0 12px rgba(245,194,107,.5); }

  #scene { position:relative; z-index:3; width:100%; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:60px 14px 84px; }

  #poem { width:min(580px,92vw); text-align:center; margin-bottom:26px; }
  .stanza { opacity:0; transform:translateY(18px);
    transition: opacity 1.5s ease, transform 1.5s ease; margin-bottom:26px; }
  .stanza.show { opacity:1; transform:none; }
  .stanza p { font-size:clamp(16px,3.6vw,21px); line-height:2.05;
    color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.55), 0 0 22px rgba(255,123,156,.25); }
  .stanza.hl p { color:var(--gold); text-shadow:0 2px 14px rgba(0,0,0,.55), 0 0 26px rgba(245,194,107,.45); }
  .stanza.date p { font-size:clamp(17px,3.9vw,23px); }
  .stanza.final p { font-size:clamp(19px,4.4vw,25px); color:var(--rose);
    text-shadow:0 2px 16px rgba(0,0,0,.6), 0 0 30px rgba(255,123,156,.55); }

  #loveHeart { position:relative; width:min(620px,92vw); aspect-ratio:670/620;
    margin:8px auto 0; }
  #garden { position:absolute; inset:0; width:100%; height:100%; }

  #words { position:absolute; top:26%; left:4%; width:92%; text-align:center; }
  #messages { display:none; opacity:0; color:#ffd9a0; font-size:clamp(15px,2.1vw,21px);
    text-shadow:0 2px 10px rgba(0,0,0,.65); transition:opacity 4s ease; }
  #elapseClock { margin-top:12px; color:#fff; }
  #elapseClock .digit { font-family:'digit'; font-size:clamp(25px,4.1vw,39px); color:var(--gold);
    text-shadow:0 0 16px rgba(245,194,107,.7); }
  #loveu { display:none; opacity:0; margin-top:26px; font-size:clamp(17px,2.5vw,24px);
    line-height:1.9; color:#fff; transition:opacity 3s ease;
    text-shadow:0 0 16px rgba(255,123,156,.75), 0 2px 8px rgba(0,0,0,.55); }
  #loveu .signature { margin-top:14px; font-size:.72em; color:var(--gold);
    text-shadow:0 0 12px rgba(245,194,107,.6); }

  #copyright { position:fixed; bottom:10px; left:0; width:100%; text-align:center;
    font-size:12px; color:rgba(234,230,255,.4); z-index:3; pointer-events:none;
    letter-spacing:2px; }

  /* heart rain */
  .heart-drop { position:fixed; top:-8vh; z-index:2; pointer-events:none;
    animation: fall var(--hd,7s) linear var(--hdl,0s) forwards; }
  @keyframes fall {
    0%   { transform:translateY(0) rotate(0deg); opacity:0; }
    6%   { opacity:.9; }
    92%  { opacity:.9; }
    100% { transform:translateY(118vh) rotate(340deg); opacity:0; }
  }
</style>
</head>

      <p>喜欢到一辈子都不够。</p>

      <p>喜欢和你一起吃火锅，</p>
      <p>喜欢和你一起看星星，</p>
      <p>喜欢你笑起来的样子。</p>
    </div>
    <div class="stanza">
      <p>牛郎织女，一年一面；</p>
      <p>而我们，把每天都过成了七夕。</p>

      var size = (Math.random() * 1.8 + 0.6).toFixed(1);
      var tw = (Math.random() * 2.6 + 1.2).toFixed(2);
      var css = 'width:' + size + 'px;height:' + size + 'px;'
        + 'left:' + (Math.random() * 100).toFixed(2) + '%;'
        + 'top:' + (Math.random() * 100).toFixed(2) + '%;'
        + 'animation:twinkle ' + tw + 's ease-in-out infinite alternate;'
        + 'animation-delay:' + (Math.random() * 3).toFixed(2) + 's;';
      if (Math.random() < 0.14) {
        css += 'background:#ffd9a0;box-shadow:0 0 6px #ffd9a0;';
      }
      s.style.cssText = css;
      sky.appendChild(s);
    }
  })();

  /* ================= garden (petal heart) ================= */
  function Vector(a, b) { this.x = a; this.y = b; }
  Vector.prototype = {
    rotate: function (b) {
      var a = this.x, c = this.y;
      this.x = Math.cos(b) * a - Math.sin(b) * c;
      this.y = Math.sin(b) * a + Math.cos(b) * c;
      return this;
    },
    mult: function (a) { this.x *= a; this.y *= a; return this; },
    clone: function () { return new Vector(this.x, this.y); },
    length: function () { return Math.sqrt(this.x * this.x + this.y * this.y); },
    subtract: function (a) { this.x -= a.x; this.y -= a.y; return this; },
    set: function (a, b) { this.x = a; this.y = b; return this; }
  };

  function Petal(a, f, b, e, c, d) {
    this.stretchA = a; this.stretchB = f; this.startAngle = b; this.angle = e;
    this.bloom = d; this.growFactor = c; this.r = 1; this.isfinished = false;
  }
  Petal.prototype = {
    draw: function () {
      var a = this.bloom.garden.ctx, e, d, c, b;
      e = new Vector(0, this.r).rotate(Garden.degrad(this.startAngle));
      d = e.clone().rotate(Garden.degrad(this.angle));
      c = e.clone().mult(this.stretchA);
      b = d.clone().mult(this.stretchB);
      a.strokeStyle = this.bloom.c;
      a.beginPath();
      a.moveTo(e.x, e.y);
      a.bezierCurveTo(c.x, c.y, b.x, b.y, d.x, d.y);
      a.stroke();
    },
    render: function () {
      if (this.r <= this.bloom.r) { this.r += this.growFactor; this.draw(); }
      else { this.isfinished = true; }
    }
  };

  function Bloom(e, d, f, a, b) {
    this.p = e; this.r = d; this.c = f; this.pc = a; this.petals = [];
    this.garden = b; this.init(); this.garden.addBloom(this);
  }
  Bloom.prototype = {
    draw: function () {
      var c, b = true;
      this.garden.ctx.save();
      this.garden.ctx.translate(this.p.x, this.p.y);
      for (var a = 0; a < this.petals.length; a++) {
        c = this.petals[a];
        c.render();
        b *= c.isfinished;
      }
      this.garden.ctx.restore();
      if (b === true) { this.garden.removeBloom(this); }
    },
    init: function () {
      var c = 360 / this.pc;
      var b = Garden.randomInt(0, 90);
      for (var a = 0; a < this.pc; a++) {
        this.petals.push(new Petal(
          Garden.random(Garden.options.petalStretch.min, Garden.options.petalStretch.max),
          Garden.random(Garden.options.petalStretch.min, Garden.options.petalStretch.max),
          b + a * c, c,
          Garden.random(Garden.options.growFactor.min, Garden.options.growFactor.max),
          this));
      }
    }
  };

  function Garden(a, b) { this.blooms = []; this.element = b; this.ctx = a; }
  Garden.prototype = {
    render: function () { for (var a = 0; a < this.blooms.length; a++) { this.blooms[a].draw(); } },
    addBloom: function (a) { this.blooms.push(a); },
    removeBloom: function (a) {
      for (var c = 0; c < this.blooms.length; c++) {
        if (this.blooms[c] === a) { this.blooms.splice(c, 1); return this; }
      }
    },
    createRandomBloom: function (a, b) {
      this.createBloom(a, b,
        Garden.randomInt(Garden.options.bloomRadius.min, Garden.options.bloomRadius.max),
        Garden.randomrgba(Garden.options.color.rmin, Garden.options.color.rmax,
          Garden.options.color.gmin, Garden.options.color.gmax,
          Garden.options.color.bmin, Garden.options.color.bmax, Garden.options.color.opacity),
        Garden.randomInt(Garden.options.petalCount.min, Garden.options.petalCount.max));
    },
    createBloom: function (a, f, d, e, b) { new Bloom(new Vector(a, f), d, e, b, this); },
    clear: function () {
      this.blooms = [];
      this.ctx.clearRect(0, 0, this.element.width, this.element.height);
    }
  };
  Garden.options = {
    petalCount:  { min: 8, max: 15 },
    petalStretch:{ min: 0.1, max: 3 },
    growFactor:  { min: 0.1, max: 1 },
    bloomRadius: { min: 8, max: 10 },
    density: 10,
    growSpeed: 1000 / 60,
    /* Qixi night: warm gold → rose petals */
    color: { rmin: 255, rmax: 255, gmin: 145, gmax: 215, bmin: 70, bmax: 150, opacity: 0.18 },
    tanAngle: 60
  };
  Garden.random = function (b, a) { return Math.random() * (a - b) + b; };
  Garden.randomInt = function (b, a) { return Math.floor(Math.random() * (a - b + 1)) + b; };
  Garden.circle = 2 * Math.PI;
  Garden.degrad = function (a) { return Garden.circle / 360 * a; };
  Garden.raddeg = function (a) { return a / Garden.circle * 360; };
  Garden.rgba = function (f, e, c, d) { return "rgba(" + f + "," + e + "," + c + "," + d + ")"; };
  Garden.randomrgba = function (i, n, h, m, l, d, k) {
    var c = Math.round(Garden.random(i, n));
    var f = Math.round(Garden.random(h, m));
    var j = Math.round(Garden.random(l, d));
    var e = 5;
    if (Math.abs(c - f) <= e && Math.abs(f - j) <= e && Math.abs(j - c) <= e) {
      return Garden.rgba(i, n, h, m, l, d, k);
    }
    return Garden.rgba(c, f, j, k);
  };

  /* ================= canvas setup ================= */
  var W = 670, H = 620;
  var canvas = document.getElementById('garden');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  var ctx = canvas.getContext('2d');
  ctx.scale(DPR, DPR);
  ctx.globalCompositeOperation = 'lighter';
  var garden = new Garden(ctx, canvas);
  var offsetX = W / 2;
  var offsetY = H / 2 - 55;

  setInterval(function () { garden.render(); }, Garden.options.growSpeed);

  function getHeartPoint(c) {
    var b = c / Math.PI;
    var a = 19.5 * (16 * Math.pow(Math.sin(b), 3));
    var d = -20 * (13 * Math.cos(b) - 5 * Math.cos(2 * b) - 2 * Math.cos(3 * b) - Math.cos(4 * b));
    return [offsetX + a, offsetY + d];
  }

  function startHeartAnimation() {
    var c = 50, d = 10, b = [];
    var a = setInterval(function () {
      var h = getHeartPoint(d);
      var e = true;
      for (var f = 0; f < b.length; f++) {
        var g = b[f];
        var j = Math.sqrt(Math.pow(g[0] - h[0], 2) + Math.pow(g[1] - h[1], 2));
        if (j < Garden.options.bloomRadius.max * 1.3) { e = false; break; }
      }
      if (e) { b.push(h); garden.createRandomBloom(h[0], h[1]); }
      if (d >= 30) { clearInterval(a); showMessages(); }
      else { d += 0.2; }
    }, c);
  }

  /* ================= poem ================= */
  var stanzas = Array.prototype.slice.call(document.querySelectorAll('#poem .stanza'));

  function revealPoem() {
    stanzas.forEach(function (s, i) {
      setTimeout(function () { s.classList.add('show'); }, 600 + i * 1900);
    });
  }

  /* ================= together clock ================= */
  /* 我们在一起的日子 —— 2026.02.27 */
  var together = new Date(2026, 1, 27, 0, 0, 0, 0);

  function timeElapse(c) {
    var f = Math.floor((Date.now() - Date.parse(c)) / 1000);
    if (f < 0) { f = 0; }
    var g = Math.floor(f / (3600 * 24));
    f = f % (3600 * 24);
    var b = Math.floor(f / 3600);
    if (b < 10) { b = "0" + b; }
    f = f % 3600;
    var d = Math.floor(f / 60);
    if (d < 10) { d = "0" + d; }
    f = f % 60;
    if (f < 10) { f = "0" + f; }
    document.getElementById('elapseClock').innerHTML =
      '<span class="digit">' + g + '</span> 天 ' +
      '<span class="digit">' + b + '</span> 小时 ' +
      '<span class="digit">' + d + '</span> 分钟 ' +
      '<span class="digit">' + f + '</span> 秒';
  }

  function showMessages() {
    var m = document.getElementById('messages');
    fadeIn(m, 4000, function () { fadeIn(document.getElementById('loveu'), 3000); });
  }

  function fadeIn(el, ms, done) {
    el.style.display = 'block';
    el.style.opacity = '0';
    el.style.transition = 'opacity ' + ms + 'ms ease';
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        el.style.opacity = '1';
        if (done) { setTimeout(done, ms + 200); }
      });
    });
  }

  /* ================= heart rain finale ================= */
  function heartRain() {
    var colors = ['#f5c26b', '#ff7b9c', '#ffd9a0', '#ff9fb8'];
    for (var i = 0; i < 26; i++) {
      (function (i) {
        setTimeout(function () {
          var d = document.createElement('div');
          d.className = 'heart-drop';
          d.textContent = '♥';
          var size = (Math.random() * 14 + 12).toFixed(1);
          d.style.cssText =
            'left:' + (Math.random() * 100).toFixed(2) + 'vw;' +
            'font-size:' + size + 'px;' +
            'color:' + colors[i % colors.length] + ';' +
            'text-shadow:0 0 10px ' + colors[i % colors.length] + ';' +
            '--hd:' + (Math.random() * 4 + 5).toFixed(1) + 's;' +
            '--hdl:' + (Math.random() * 4).toFixed(2) + 's;';
          document.body.appendChild(d);
          setTimeout(function () { d.remove(); }, 14000);
        }, i * 260 + Math.random() * 900);
      })(i);
    }
  }

  /* ================= boot ================= */
  revealPoem();
  /* heart blooms as the last lines appear (7 stanzas × 1.9s ≈ 13.9s) */
  setTimeout(function () { startHeartAnimation(); }, 12500);
  timeElapse(together);
  setInterval(function () { timeElapse(together); }, 500);

  var rainFired = false;
  var _orig = showMessages;
  showMessages = function () {
    _orig();
    if (!rainFired) {
      rainFired = true;
      setTimeout(heartRain, 7000);
    }
  };
})();
</script>
